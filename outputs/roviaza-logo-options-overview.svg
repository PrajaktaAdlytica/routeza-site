  <text x="96" y="434" fill="#0B1715" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">1. Signal Grid</text>
  <text x="96" y="472" fill="#5B6B66" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500">Feels operational and structured.</text>
  <text x="96" y="502" fill="#5B6B66" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500">Best if you want route intelligence</text>
  <text x="96" y="532" fill="#5B6B66" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500">without looking playful.</text>


  <text x="592" y="472" fill="#5B6B66" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500">Feels more premium and fluid.</text>
  <text x="592" y="502" fill="#5B6B66" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500">Best if you want motion and</text>
  <text x="592" y="532" fill="#5B6B66" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500">adaptability without a literal map.</text>

